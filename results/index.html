<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ResumeAI — Results</title>
    <link rel="stylesheet" href="/assets/styles.css" />
    <style>
      .results-header {
        display: flex;
        align-items: center;
        gap: 24px;
        margin-bottom: 32px;
      }
      .results-meta { flex: 1; }
      .results-role { font-size: 20px; font-weight: 700; margin: 0 0 4px; }
      .results-level { font-size: 14px; color: var(--text-muted); }
    </style>
  </head>
  <body class="page">
    <nav class="nav">
      <a href="/landing/" class="nav-logo">ResumeAI</a>
    </nav>

    <div class="page-inner">
      <div class="steps">
        <div class="step done"><span class="step-dot">✓</span><span>Upload</span></div>
        <div class="step-line"></div>
        <div class="step done"><span class="step-dot">✓</span><span>Target role</span></div>
        <div class="step-line"></div>
        <div class="step done"><span class="step-dot">✓</span><span>Questions</span></div>
        <div class="step-line"></div>
        <div class="step active"><span class="step-dot">4</span><span>Download</span></div>
      </div>

      <div class="results-header">
        <div class="score-ring">
          <span class="score-number" id="fitScore">—</span>
          <span class="score-label">fit score</span>
        </div>
        <div class="results-meta">
          <p class="results-role" id="resultsRole">—</p>
          <p class="results-level" id="resultsLevel">—</p>
        </div>
      </div>

      <div class="card result-section">
        <p class="result-section-title">Strengths</p>
        <div class="tag-list" id="strengthsList">—</div>
      </div>

      <div class="card result-section">
        <p class="result-section-title">Gaps</p>
        <div class="tag-list" id="gapsList">—</div>
      </div>

      <div class="card result-section">
        <p class="result-section-title">ATS flags</p>
        <div id="atsFlagsList" class="muted">—</div>
      </div>

      <div class="divider"></div>

      <h2 style="font-size:18px;font-weight:700;margin:0 0 8px;">Download your variant</h2>
      <p class="muted" style="margin:0 0 20px;font-size:13px;" id="downloadGate">Subscribe to download your resume — $50/mo, cancel anytime.</p>

      <button class="download-btn" id="downloadLatex">
        <div class="download-btn-icon">📝</div>
        <div class="download-btn-text">
          <span class="download-btn-title">LaTeX source (.tex)</span>
          <span class="download-btn-hint">Edit and compile with any LaTeX engine</span>
        </div>
        <span style="color:var(--text-muted);font-size:13px;" id="latexIcon">→</span>
      </button>

      <button class="download-btn mt-16" id="downloadPdf">
        <div class="download-btn-icon">📄</div>
        <div class="download-btn-text">
          <span class="download-btn-title">PDF (.pdf)</span>
          <span class="download-btn-hint">Ready to attach and submit</span>
        </div>
        <span style="color:var(--text-muted);font-size:13px;" id="pdfIcon">→</span>
      </button>

      <div class="mt-24" style="text-align:center;">
        <a href="/upload/" class="btn btn-ghost">Start over with a new resume</a>
      </div>
    </div>

    <script src="/assets/backend-client.js"></script>
    <script src="/assets/flow-state.js"></script>
    <script>
      "use strict";

      const access = FLOW.canAccess("/results/");
      if (!access.ok) window.location.href = access.next;

      const state    = FLOW.getState();
      const analysis = state.analysis || {};
      const variant  = state.variant  || {};

      // Populate header
      document.getElementById("resultsRole").textContent  = state.target_role  || "—";
      document.getElementById("resultsLevel").textContent = state.target_level || "—";
      document.getElementById("fitScore").textContent     = analysis.fit_score != null ? analysis.fit_score : "—";

      // Strengths
      const strengthsEl = document.getElementById("strengthsList");
      const strengths = analysis.strengths || ["Strong technical signal", "Clear ownership language", "Measurable impact"];
      strengthsEl.innerHTML = strengths.map(s => `<span class="tag good">${s}</span>`).join("");

      // Gaps
      const gapsEl = document.getElementById("gapsList");
      const gaps = analysis.gaps || ["Add scale metrics", "Clarify team scope", "ATS keyword coverage"];
      gapsEl.innerHTML = gaps.map(g => `<span class="tag gap">${g}</span>`).join("");

      // ATS flags
      const atsEl = document.getElementById("atsFlagsList");
      const flags = analysis.ats_flags || [];
      atsEl.innerHTML = flags.length
        ? flags.map(f => `<p style="margin:4px 0;font-size:13px;">• ${f}</p>`).join("")
        : '<p style="margin:0;font-size:13px;">No major ATS issues detected.</p>';

      // Subscription gate
      const isSubscribed = state.subscription_status === "active";

      // Update UI based on subscription
      const gateMsg   = document.getElementById("downloadGate");
      const latexIcon = document.getElementById("latexIcon");
      const pdfIcon   = document.getElementById("pdfIcon");
      if (isSubscribed) {
        gateMsg.style.display = "none";
        latexIcon.textContent = "↓";
        pdfIcon.textContent   = "↓";
      }

      function goToCheckout() {
        // Store return path so checkout can redirect back
        sessionStorage.setItem("resumeai_return", "/results/");
        window.location.href = "/pricing/";
      }

      function downloadText(filename, content) {
        const blob = new Blob([content], { type: "text/plain" });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement("a");
        a.href = url; a.download = filename; a.click();
        URL.revokeObjectURL(url);
      }

      document.getElementById("downloadLatex").addEventListener("click", () => {
        if (!isSubscribed) { goToCheckout(); return; }
        const tex = variant.latex || "% No LaTeX generated.\n";
        downloadText("resume-variant.tex", tex);
      });

      document.getElementById("downloadPdf").addEventListener("click", async function () {
        if (!isSubscribed) { goToCheckout(); return; }

        const tex = variant.latex || "";
        if (!tex || tex.startsWith("%")) {
          alert("No variant generated yet. Complete the flow first.");
          return;
        }
        const btn = this;
        btn.disabled = true;
        pdfIcon.textContent = "…";

        try {
          const res = await fetch("/api/resume/compile-pdf", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ latex: tex }),
          });
          if (!res.ok) {
            const err = await res.json().catch(() => ({ error: "Compilation failed." }));
            throw new Error(err.error || `Server error ${res.status}`);
          }
          const pages = res.headers.get("X-Page-Count");
          const blob  = await res.blob();
          const url   = URL.createObjectURL(blob);
          const a     = document.createElement("a");
          a.href = url; a.download = "resume-variant.pdf"; a.click();
          URL.revokeObjectURL(url);
          if (pages && parseInt(pages) > 2) {
            setTimeout(() => alert(`Note: your variant is ${pages} pages. Consider trimming bullets for a 1-page resume.`), 500);
          }
        } catch (err) {
          alert(`PDF download failed: ${err.message}`);
        } finally {
          btn.disabled = false;
          pdfIcon.textContent = "↓";
        }
      });
    </script>
  </body>
</html>
